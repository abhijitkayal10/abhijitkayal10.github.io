name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A15C86: ${{ secrets.A15C86 }}
          BC02E0: ${{ secrets.BC02E0 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A15C86', '')
          tag_b = os.environ.get('BC02E0', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 0f031f8f9e8398103cffd8a22fd7caa7694d -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 49cef5698e14861d22b070fd -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
